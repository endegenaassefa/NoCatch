<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chat</title>
    <link href="./src/styles/common.css" rel="stylesheet" />
    <!-- PrismJS theme for syntax highlighting -->
    <link rel="stylesheet" href="./node_modules/prismjs/themes/prism-tomorrow.min.css" />
    <style>
      /* Font Awesome now loaded via <link> above */

      body {
        background: transparent !important;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .chat-container {
        width: 100%;
        height: 100vh;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(20, 20, 20, 0.4) 100%
        );
        backdrop-filter: blur(25px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        -webkit-app-region: drag;
      }
      .chat-header {
        padding: 16px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        -webkit-app-region: drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        cursor: move;
        flex-shrink: 0;
      }
      .header-title {
        color: rgba(255, 255, 255, 0.95);
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      /* Header actions (e.g., Clear History) */
      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-button {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .icon-button:hover {
        background: rgba(255, 255, 255, 0.22);
        color: #fff;
      }
      .icon-button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Armed exam mode: accent the shield button so the state is obvious */
      .icon-button.active {
        background: rgba(255, 193, 7, 0.28);
        border-color: rgba(255, 193, 7, 0.65);
        color: #ffd54f;
      }
      /* Question-type selector in the header menu */
      .skill-select {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.9);
        border-radius: 6px;
        padding: 5px 6px;
        font-size: 12px;
        cursor: pointer;
        outline: none;
        max-width: 130px;
      }
      .skill-select option {
        background: #1c1c1c;
        color: #fff;
      }
      .skill-select:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      /* Exam-mode status banner (hidden unless armed) */
      .exam-banner {
        display: none;
        -webkit-app-region: no-drag;
        background: rgba(255, 193, 7, 0.12);
        border-bottom: 1px solid rgba(255, 193, 7, 0.35);
        color: #ffe082;
        font-size: 11.5px;
        line-height: 1.4;
        padding: 6px 14px;
        flex-shrink: 0;
      }
      /* Exam-mode discipline: answer text is not selectable while armed —
         accidental Cmd+C from the chat is a clipboard proctor tell, the same
         reason the shield overlay makes its text non-selectable. The input
         box stays selectable so typing works. */
      .exam-active .message-text {
        user-select: none;
        -webkit-user-select: none;
      }
      .recording-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4757;
        animation: pulse 2s infinite;
        display: none;
        box-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
      }
      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-app-region: no-drag;
        box-sizing: border-box;
        /* Removed max-height restriction */
      }
      .message {
        margin-bottom: 16px;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        border-left: 3px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        word-wrap: break-word;
        word-break: break-word;
        /* Removed all height restrictions */
        position: relative;
      }
      .message.transcription {
        background: rgba(76, 175, 80, 0.15);
        animation: fadeInSlide 0.1s ease-out;
        position: relative;
      }

      .message.transcription::before {
        position: absolute;
        left: -8px;
        top: 8px;
        font-size: 12px;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeInSlide {
        from {
          opacity: 0;
          transform: translateX(-20px);
          background: rgba(76, 175, 80, 0.3);
        }
        to {
          opacity: 1;
          transform: translateX(0);
          background: rgba(76, 175, 80, 0.15);
        }
      }
      .message.system {
        background: rgba(33, 150, 243, 0.1);
      }
      .message.error {
        background: rgba(244, 67, 54, 0.1);
      }
      .message.user {
        background: rgba(255, 152, 0, 0.1);
      }
      .message.assistant {
        background: rgba(156, 39, 176, 0.1);
        border-left: 3px solid #9c27b0;
        /* Removed all height restrictions and overflow hidden */
        display: block;
      }
      
      .message.assistant .message-text {
        /* Removed all height restrictions and overflow hidden */
        white-space: pre-wrap;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      /* Ensure all content in assistant messages is fully visible */
      .message.assistant *,
      .message.assistant .bullet-point,
      .message.assistant .numbered-point,
      .message.assistant strong,
      .message.assistant em,
      .message.assistant code,
      .message.assistant pre,
      .message.assistant ul,
      .message.assistant ol,
      .message.assistant li,
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6,
      .message.assistant p,
      .message.assistant blockquote {
        /* Remove all height restrictions */
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
      }
      
      /* Markdown formatting for assistant messages */
      .message.assistant .bullet-point {
        margin: 4px 0;
        padding-left: 8px;
        line-height: 1.4;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point {
        margin: 4px 0;
        padding-left: 16px;
        line-height: 1.4;
        position: relative;
        counter-increment: list-counter;
        word-wrap: break-word;
        word-break: break-word;
        overflow-wrap: break-word;
      }
      
      .message.assistant .numbered-point::before {
        content: counter(list-counter) ". ";
        position: absolute;
        left: 0;
        font-weight: 500;
        color: rgba(156, 39, 176, 0.8);
      }
      
      .message.assistant {
        counter-reset: list-counter;
      }
      
      .message.assistant strong {
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant em {
        font-style: italic;
        color: rgba(255, 255, 255, 0.9);
      }
      
      .message.assistant code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 4px;
        border-radius: 3px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        display: inline;
      }
      
      /* Ensure code blocks are fully visible */
      .message.assistant pre {
        background: rgba(0, 0, 0, 0.4);
        padding: 8px 12px;
        border-radius: 6px;
        font-family: 'Monaco', 'Menlo', monospace;
        font-size: 11px;
        color: #64ffda;
        overflow-x: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
        margin: 8px 0;
        position: relative;
      }
      
      .message.assistant pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
        display: block;
      }

      /* Copy buttons REMOVED — clipboard writes are a proctor tell. */

      /* Ensure lists are fully visible */
      .message.assistant ul,
      .message.assistant ol {
        margin: 8px 0;
        padding-left: 20px;
      }
      
      .message.assistant li {
        margin: 4px 0;
        line-height: 1.4;
      }
      
      /* Ensure headings are fully visible */
      .message.assistant h1,
      .message.assistant h2,
      .message.assistant h3,
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 {
        margin: 12px 0 8px 0;
        font-weight: 600;
        color: rgba(255, 255, 255, 1);
      }
      
      .message.assistant h1 { font-size: 16px; }
      .message.assistant h2 { font-size: 15px; }
      .message.assistant h3 { font-size: 14px; }
      .message.assistant h4,
      .message.assistant h5,
      .message.assistant h6 { font-size: 13px; }
      
      /* Ensure paragraphs are fully visible */
      .message.assistant p {
        margin: 8px 0;
      }
      
      /* Ensure blockquotes are fully visible */
      .message.assistant blockquote {
        border-left: 3px solid rgba(156, 39, 176, 0.5);
        padding-left: 12px;
        margin: 8px 0;
        font-style: italic;
        color: rgba(255, 255, 255, 0.8);
      }
      
      /* Thinking indicator animation */
      .thinking-dots {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      
      .thinking-dots .dot {
        opacity: 0.4;
        animation: thinking 1.4s infinite ease-in-out;
      }
      
      .thinking-dots .dot:nth-child(1) { animation-delay: 0s; }
      .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
      .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
      
      @keyframes thinking {
        0%, 80%, 100% {
          opacity: 0.4;
          transform: scale(1);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
      
      .message.thinking {
        animation: fadeIn 0.3s ease-out;
      }
      
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .message-time {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
        margin-bottom: 4px;
        font-weight: 500;
      }
      .message-text {
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        max-width: 100%;
        display: block;
      }
      .message-text .math {
        font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
        white-space: nowrap;
      }
      .message-text sup, .message-text sub {
        font-size: 0.72em;
        line-height: 0;
      }
      .chat-input {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
        background: rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(10px);
        flex-shrink: 0;
      }
      .input-container {
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        -webkit-app-region: no-drag;
      }
      .input-field {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.95);
        font-size: 13px;
        outline: none;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        /* make it work well as multiline */
        resize: none;
        line-height: 1.4;
        min-height: 32px;
        max-height: 140px;
        overflow-y: auto;
      }
      .input-field:focus {
        outline: none;
      }
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .send-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .send-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .status-message {
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        padding: 20px;
        font-style: italic;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .error-message {
        color: #ff4757;
        font-size: 12px;
        padding: 10px;
        text-align: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      .mic-button {
        background: rgba(255, 255, 255, 0.15);
        border: none;
        border-radius: 6px;
        padding: 6px 10px;
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: all 0.2s;
        -webkit-app-region: no-drag;
      }
      .mic-button:hover {
        background: rgba(255, 255, 255, 0.25);
        color: rgba(255, 255, 255, 1);
      }
      .mic-button.recording {
        background: rgba(255, 71, 87, 0.8);
        color: white;
        box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
      }
      .help-text {
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        text-align: center;
        padding: 10px;
        line-height: 1.4;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }
      .interaction-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
        z-index: 1000;
      }
      .interaction-indicator.show {
        opacity: 1;
      }
      .interaction-indicator.interactive {
        background: rgba(76, 175, 80, 0.9);
      }
      .interaction-indicator.non-interactive {
        background: rgba(244, 67, 54, 0.9);
      }
      .non-interactive .input-container {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .mic-button {
        pointer-events: none;
        opacity: 0.5;
      }
      .non-interactive .send-button {
        pointer-events: none;
        opacity: 0.5;
      }

      /* Minimalist Listening Animation */
      .listening-indicator {
        display: none;
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(203, 203, 203, 0.3);
        border-radius: 20px;
        padding: 8px 16px;
        z-index: 1000;
        pointer-events: none;
      }

      .listening-indicator.active {
        display: flex;
        align-items: center;
        gap: 8px;
        animation: fadeInUp 0.3s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .listening-wave {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .wave-bar {
        width: 2px;
        background: #4caf50;
        border-radius: 1px;
        animation: waveAnimation 1.2s infinite ease-in-out;
      }

      .wave-bar:nth-child(1) {
        height: 8px;
        animation-delay: 0s;
      }
      .wave-bar:nth-child(2) {
        height: 12px;
        animation-delay: 0.15s;
      }
      .wave-bar:nth-child(3) {
        height: 16px;
        animation-delay: 0.3s;
      }
      .wave-bar:nth-child(4) {
        height: 12px;
        animation-delay: 0.45s;
      }
      .wave-bar:nth-child(5) {
        height: 8px;
        animation-delay: 0.6s;
      }

      @keyframes waveAnimation {
        0%, 100% {
          transform: scaleY(0.3);
          opacity: 0.6;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }

      .listening-text {
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .listening-duration {
        color: rgba(76, 175, 80, 0.8);
        font-size: 10px;
        font-family: monospace;
        margin-left: 4px;
      }

      /* Interim text overlay */
      .interim-overlay {
        position: fixed;
        bottom: 80px;
        left: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.028);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(76, 175, 80, 0.3);
        border-radius: 8px;
        padding: 12px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        font-style: italic;
        z-index: 999;
        pointer-events: none;
        display: none;
        animation: slideUpFade 0.3s ease-out;
      }

      .interim-overlay.active {
        display: block;
      }

      @keyframes slideUpFade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container" id="chatContainer">
      <div class="chat-header">
        <div class="header-title">
          <i class="fas fa-microphone"></i>
          Live Transcription & Chat
          <div class="recording-indicator" id="recordingIndicator"></div>
        </div>
        <div class="header-actions">
          <select class="skill-select" id="chatSkillSelect" title="Question type">
            <option value="dsa">DSA</option>
          </select>
          <button class="icon-button" id="chatCaptureBtn" title="Take a picture — answer lands in this chat (Ctrl/Cmd+Shift+S)">
            <span aria-hidden="true">📷</span>
          </button>
          <button class="icon-button" id="chatExamBtn" title="Arm exam mode — shield captures, answers land in this chat">
            <span aria-hidden="true">🛡️</span>
          </button>
          <button class="icon-button" id="clearHistoryBtn" title="Clear chat history">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 16px;font-size:12px;color:#d0d8e8;background:#151923"><span id="material-summary">Materials optional</span><button id="chat-materials" class="icon-button" style="width:auto;font:inherit;padding:4px 8px">Materials</button></div>
      <div id="speechStatus" role="status" aria-live="polite" style="padding: 4px 16px; font-size: 12px; color: #a9b6cc; min-height: 24px;">Microphone idle</div>
      <div class="exam-banner" id="examModeBanner">
        🛡️ Exam mode armed — the shield captures and answers land in this chat. Mic, question types and typing keep working. Click 🛡️ or press ⌃⌥⇧E to restore.
      </div>

      <!-- Interim Text Overlay -->
      <div class="interim-overlay" id="interimOverlay"></div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input">
        <div class="input-container">
          <textarea
            class="input-field"
            placeholder="Type a message… (Shift+Enter for newline)"
            id="messageInput"
            rows="1"
          ></textarea>
          <button class="mic-button" id="micButton">
            <i class="fas fa-microphone"></i>
          </button>
          <button class="send-button" id="sendButton">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <script src="lib/sanitize.js"></script>
    <!-- PrismJS core and autoloader for language components -->
    <script src="./node_modules/prismjs/prism.min.js"></script>
    <script src="./node_modules/prismjs/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
      // Configure Prism autoloader
      try { if (window.Prism && Prism.plugins && Prism.plugins.autoloader) { Prism.plugins.autoloader.languages_path = './node_modules/prismjs/components/'; } } catch (_) {}
    </script>
    <script>
      // Use electronAPI from preload script instead of direct require
      const whysperAPI = window.electronAPI;

      const chatMessages = document.getElementById('chatMessages');
      const recordingIndicator = document.getElementById('recordingIndicator');
      const speechStatus = document.getElementById('speechStatus');
      const messageInput = document.getElementById('messageInput');
      const sendButton = document.getElementById('sendButton');
      const micButton = document.getElementById('micButton');
      const chatContainer = document.getElementById('chatContainer');
      const listeningIndicator = document.getElementById('listeningIndicator');
      const listeningDuration = document.getElementById('listeningDuration');
      const interimOverlay = document.getElementById('interimOverlay');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      // Unified header menu (UNIFIED-CHAT-SURFACE.md): question-type selector,
      // capture button, and exam-mode toggle live in the chat header so every
      // flow — normal picture, typed, spoken, or exam shield — stays inside
      // this one UI.
      const chatSkillSelect = document.getElementById('chatSkillSelect');
      const chatCaptureBtn = document.getElementById('chatCaptureBtn');
      const chatExamBtn = document.getElementById('chatExamBtn');
      const examModeBannerEl = document.getElementById('examModeBanner');

      let isRecording = false;
      let isInteractive = true;
      let listeningStartTime = null;
      let listeningTimer = null;
      let speechAvailable = false;
      let thinkingTimer = null;
      let chatGeneration = 0;
      let requestSequence = 0;
      const requestPrefix = `chat-ui-${crypto.randomUUID()}-`;
      const pendingResponses = new Map();
      const retiredRequests = new Set();

      // Request ownership is established before invoking IPC, including capture
      // work that has not started an LLM stream yet.
      function beginRequest(id = `${requestPrefix}${++requestSequence}`) {
        if (retiredRequests.has(id)) return null;
        if (!pendingResponses.has(id)) {
          pendingResponses.set(id, { id, generation: chatGeneration });
        }
        return pendingResponses.get(id);
      }

      function responseId(data) {
        return data && (data.requestId || data.metadata?.requestId || data.messageId || data.metadata?.messageId);
      }

      function pendingResponse(data) {
        const request = pendingResponses.get(responseId(data));
        return request && request.generation === chatGeneration ? request : null;
      }

      // Chat persistence and deduplication
      const CHAT_HISTORY_KEY = 'sru_chat_history_v1';
      let chatHistory = [];
      let materialPrivacy=true, materialSeen=false, materialStatusResolved=false;
      function protectMaterials(data){if(data?.materialSession||data?.metadata?.materialSession){materialSeen=true;materialPrivacy=true;try{localStorage.removeItem(CHAT_HISTORY_KEY);}catch{}}}
      document.getElementById('chat-materials').onclick=()=>whysperAPI.showMaterials();
      whysperAPI.onMaterialsStatus?.(status=>{
        if(['draft','active'].includes(status.state)){materialSeen=true;materialPrivacy=true;try{localStorage.removeItem(CHAT_HISTORY_KEY);}catch{}}
        document.getElementById('material-summary').textContent=status.state==='active'?`${status.documents.filter(d=>['ready','partial'].includes(d.state)).length} files · ${Math.max(0,Math.ceil((status.expiresAt-Date.now())/60000))} min left`:'Materials optional';
      });
      whysperAPI.onMaterialsInvalidated?.(()=>{materialSeen=true;materialPrivacy=true;clearChatHistory(true);document.getElementById('messageInput').value='';});
      const recentResponseHashes = new Set();
      const RECENT_HASH_LIMIT = 50;

      function hashString(str) {
        try {
          let h = 2166136261 >>> 0; // FNV-1a
          for (let i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        } catch (_) {
          return String(str?.length || 0);
        }
      }

      function saveHistory() {
        try {
          if(materialPrivacy){localStorage.removeItem(CHAT_HISTORY_KEY);return;}
          localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory.slice(-500)));
        } catch (e) {
          console.warn('Failed to save history', e);
        }
      }

      function loadHistory() {
        try {
          const raw = localStorage.getItem(CHAT_HISTORY_KEY);
          if (!raw) return;
          const items = JSON.parse(raw);
          if (Array.isArray(items)) {
            chatHistory = items;
            // Render
            items.forEach(item => {
              if (item.kind === 'message') {
                addMessage(item.text, item.type, true);
              } else if (item.kind === 'snippet') {
                addCodeSnippet(item.language, item.code, true);
              }
            });
          }
        } catch (e) {
          console.warn('Failed to load history', e);
        }
      }

      function clearChatHistory(skipConfirm = false) {
        if (!skipConfirm) {
          const ok = confirm('Clear chat history?');
          if (!ok) return;
        }
        chatGeneration++;
        for (const request of pendingResponses.values()) finishPendingResponse(request);
        hideThinkingIndicator();
        recentResponseHashes.clear();
        chatHistory = [];
        saveHistory();
        // Clear DOM
        if (chatMessages) chatMessages.innerHTML = '';
      }

      function applyMicVisibility() {
        if (micButton) {
          micButton.style.display = speechAvailable ? '' : 'none';
        }
      }
      
      async function initSpeechAvailability() {
        try {
          if (window.electronAPI && window.electronAPI.getSpeechAvailability) {
            speechAvailable = await window.electronAPI.getSpeechAvailability();
            applyMicVisibility();
          }
        } catch (e) {
          speechAvailable = false;
          applyMicVisibility();
        }
      }
      
      // Listen for availability changes
      if (whysperAPI && whysperAPI.onSpeechAvailability) {
        whysperAPI.onSpeechAvailability((event, data) => {
          speechAvailable = !!(data && data.available);
          applyMicVisibility();
        });
      }
      
      // Also capture generic LLM responses (from OCR/screenshot flows)
      if (whysperAPI && whysperAPI.onLlmResponse) {
        whysperAPI.onLlmResponse((event, data) => {
          protectMaterials(data);
          const request = pendingResponse(data);
          if (responseId(data) && !request) return;
          if (request) finishPendingResponse(request);
          if (data && data.response) {
            renderAssistantResponse(data.response, responseId(data));
          }
        });
      }

      if (whysperAPI && whysperAPI.onLlmError) {
        whysperAPI.onLlmError((event, data) => {
          showResponseError('Could not get an answer', data, pendingResponse(data));
        });
      }
      if (whysperAPI && whysperAPI.onOcrError) {
        whysperAPI.onOcrError((event, data) => {
          showResponseError('Could not answer the screenshot', data, pendingResponse(data));
        });
      }

      if (whysperAPI && whysperAPI.onChatRequestStarted) {
        whysperAPI.onChatRequestStarted((event, data) => {
          protectMaterials(data);
          if (data && data.requestId) beginRequest(data.requestId);
        });
      }

      // Clear on session-cleared from main
      if (whysperAPI && whysperAPI.onSessionCleared) {
        whysperAPI.onSessionCleared(() => {
          clearChatHistory(true);
        });
      }

      // ── Unified header menu: question type, capture, exam mode ──────────
      const CHAT_SKILLS = [
        { id: 'dsa', label: 'DSA' },
        { id: 'mcq', label: 'MCQ' },
        { id: 'ood', label: 'OOD' },
        { id: 'system-design', label: 'System Design' },
        { id: 'behavioral', label: 'Behavioral' },
        { id: 'programming', label: 'Programming' }
      ];

      function populateSkillSelect(active) {
        if (!chatSkillSelect) return;
        chatSkillSelect.innerHTML = '';
        CHAT_SKILLS.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id;
          opt.textContent = s.label;
          if (s.id === active) opt.selected = true;
          chatSkillSelect.appendChild(opt);
        });
      }

      async function initSkillSelect() {
        let active = 'dsa';
        try {
          if (whysperAPI && whysperAPI.getSettings) {
            const settings = await whysperAPI.getSettings();
            if (settings && settings.activeSkill) active = settings.activeSkill;
          }
        } catch (e) { /* default */ }
        populateSkillSelect(active);
      }

      if (chatSkillSelect) {
        chatSkillSelect.addEventListener('change', () => {
          const skill = chatSkillSelect.value;
          if (!skill) return;
          if (whysperAPI && whysperAPI.updateActiveSkill) {
            whysperAPI.updateActiveSkill(skill)
              .then(() => {
                const label = chatSkillSelect.selectedOptions[0]
                  ? chatSkillSelect.selectedOptions[0].textContent : skill;
                addMessage(`Question type: ${label}`, 'system', true);
              })
              .catch(err => addMessage(`Skill switch failed: ${err.message}`, 'error'));
          }
        });
        initSkillSelect();
      }

      // Keep the dropdown in sync when the skill changes elsewhere (overlay arrows)
      if (whysperAPI && whysperAPI.onSkillChanged) {
        whysperAPI.onSkillChanged((event, data) => {
          if (data && data.skill && chatSkillSelect) {
            const known = CHAT_SKILLS.some(s => s.id === data.skill);
            if (!known) populateSkillSelect(data.skill);
            else chatSkillSelect.value = data.skill;
          }
        });
      }

      // ── Exam mode toggle + banner ────────────────────────────────────────
      let examModeActive = false;
      let rootMode = false;

      function setRootModeUi(state) {
        rootMode = true;
        const s = state || {};
        const shortcut = s.captureShortcut || '⌘⇧Space';
        // Platform-true copy: on macOS the kill-immunity claim was measured
        // (EPERM against a real LockDown Browser kill sweep); on Windows the
        // elevated instance is new and survival is UNMEASURED — report only
        // verified behavior (independent review finding 3, 2026-09-25).
        const bannerText = s.platform === 'win32'
          ? `🛡️ Root exam mode — this Cluely runs elevated (Administrator or SYSTEM integrity). Chat, question types, mic, settings and ${shortcut} capture are all live. Do not run the shield helper alongside it.`
          : `🛡️ Root exam mode — this Cluely runs as root: LockDown Browser cannot kill it. Chat, question types, mic, settings and ${shortcut} capture are all live. Do not run the shield helper alongside it.`;
        if (chatExamBtn) {
          chatExamBtn.classList.add('active');
          chatExamBtn.title = s.platform === 'win32'
            ? 'Root mode: Cluely runs elevated (Administrator or SYSTEM integrity) — no shield needed.'
            : 'Root mode: Cluely itself is the root, kill-immune exam app — no shield needed.';
        }
        if (examModeBannerEl) {
          examModeBannerEl.style.display = 'block';
          examModeBannerEl.textContent = bannerText;
        }
      }

      function setExamModeUi(active) {
        examModeActive = !!active;
        if (rootMode) return; // root banner/state wins; nothing to toggle
        if (chatExamBtn) {
          chatExamBtn.classList.toggle('active', examModeActive);
          chatExamBtn.title = examModeActive
            ? 'Exam mode armed — answers land in this chat. Click to restore (⌃⌥⇧E).'
            : 'Arm exam mode — shield captures, answers land in this chat';
        }
        if (examModeBannerEl) {
          examModeBannerEl.style.display = examModeActive ? 'block' : 'none';
        }
        // Exam discipline: make answer text non-selectable while armed.
        if (chatContainer) {
          chatContainer.classList.toggle('exam-active', examModeActive);
        }
      }

      async function toggleExamMode() {
        if (!whysperAPI || !whysperAPI.shieldExamMode) return;
        if (rootMode) {
          addMessage('🛡️ Root mode: Cluely is already running elevated — the shield is not needed.', 'system', true);
          return;
        }
        if (chatExamBtn) chatExamBtn.disabled = true;
        try {
          const result = await whysperAPI.shieldExamMode({});
          if (result && result.ok === true) {
            setExamModeUi(result.examMode !== false);
            // Hotkey health surfaced at arm time (2026-09-19 real-test
            // failure): the helper re-asserts its ⌘⇧Space registration every
            // 10 s, so a false here usually self-heals within seconds.
            if (result.helperHotkeyOk === false) {
              addMessage('⚠ Shield hotkey not registered yet — it retries every 10 s. If it stays silent, restart the helper, then try ⌘⇧Space again.', 'system', true);
            }
          } else {
            addMessage('Exam mode failed: ' + ((result && result.error) || 'unknown error'), 'error');
          }
        } catch (e) {
          addMessage('Exam mode failed: ' + e.message, 'error');
        } finally {
          if (chatExamBtn) chatExamBtn.disabled = false;
        }
      }

      if (chatExamBtn) {
        chatExamBtn.addEventListener('click', toggleExamMode);
        if (whysperAPI && whysperAPI.getExamModeState) {
          whysperAPI.getExamModeState()
            .then(s => {
              if (s && s.root) {
                setRootModeUi(s);
              } else {
                setExamModeUi(!!(s && s.active));
              }
            })
            .catch(() => {});
        }
      }

      if (whysperAPI && whysperAPI.onShieldExamModeChanged) {
        whysperAPI.onShieldExamModeChanged((event, data) => {
          setExamModeUi(!!(data && data.active));
        });
      }

      // ── Capture button: take a picture → answer renders in this chat ────
      if (chatCaptureBtn) {
        chatCaptureBtn.addEventListener('click', async () => {
          if (!whysperAPI || !whysperAPI.takeScreenshot) return;
          const request = beginRequest();
          request.captureStatus = addMessage('📷 Taking a picture…', 'system', true);
          try {
            const result = await whysperAPI.takeScreenshot(request.id);
            if (result && result.success === false) {
              showResponseError('Capture failed', result.error, request);
            }
          } catch (e) {
            showResponseError('Capture failed', e, request);
          }
        });
      }

      // ── Shield answers land in the chat ──────────────────────────────────
      if (whysperAPI && whysperAPI.onShieldAnswer) {
        whysperAPI.onShieldAnswer((event, data) => {
          if (data && data.text) {
            try { hideThinkingIndicator(); } catch (_) {}
            renderAssistantResponse(data.text);
          }
        });
      }

      // Initialize availability and history
      if(whysperAPI.getMaterialsStatus){whysperAPI.getMaterialsStatus().then(reply=>{
        const status=reply.status||reply;materialStatusResolved=true;
        if(reply.success===false||!status.state||['draft','active'].includes(status.state))materialSeen=true;
        materialPrivacy=materialSeen;if(materialPrivacy)localStorage.removeItem(CHAT_HISTORY_KEY);else if(!chatHistory.length)loadHistory();
      }).catch(()=>{materialSeen=true;materialPrivacy=true;});}else{materialPrivacy=false;loadHistory();}
      initSpeechAvailability();

      // Basic message function with markdown support for assistant messages
      function addMessage(text, type = 'user', skipPersist = false) {
        if (!chatMessages) {
          console.error('Chat messages element not found!');
          return;
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';
        
        // Format assistant messages as markdown
        if (type === 'assistant') {
          textDiv.innerHTML = formatMarkdown(text);
          if (window.renderMathInElement) window.renderMathInElement(textDiv);
        } else {
          textDiv.textContent = text;
        }

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);

        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        if (!skipPersist) {
          chatHistory.push({ kind: 'message', type, text });
          saveHistory();
        }
        return messageDiv;
      }

      // Markdown formatter using markdown.js library
      function formatMarkdown(text) {
        if (!text) return '';
        
        try {
          let html;
          if (typeof markdown !== 'undefined' && markdown.toHTML) {
            html = markdown.toHTML(text);
          } else {
            console.warn('Markdown library not loaded, falling back to basic formatting');
            html = text
              .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
              .replace(/\*(.+?)\*/g, '<em>$1</em>')
              .replace(/`(.+?)`/g, '<code>$1</code>')
              .replace(/\n/g, '<br>');
          }
          // Scrub script/event-handler/javascript: constructs before the
          // output hits innerHTML — in root exam mode this renderer runs
          // unsandboxed as root and LLM output is untrusted input.
          if (window.sanitizeHtml) html = window.sanitizeHtml(html);
          return html;
        } catch (error) {
          console.error('Markdown parsing failed:', error);
          return text.replace(/\n/g, '<br>');
        }
      }

      // Own the delay so completion, errors and clearing can cancel it.
      function scheduleThinkingIndicator(request = null) {
        hideThinkingIndicator(request);
        const timer = setTimeout(() => {
          if (request) {
            request.thinkingTimer = null;
            if (pendingResponses.get(request.id) !== request || request.generation !== chatGeneration) return;
          } else {
            thinkingTimer = null;
          }
          showThinkingIndicator(request);
        }, 300);
        if (request) request.thinkingTimer = timer;
        else thinkingTimer = timer;
      }

      // Show thinking indicator
      function showThinkingIndicator(request = null) {
        if (request ? request.thinkingIndicator : document.getElementById('thinking-indicator')) return;
        const thinkingDiv = document.createElement('div');
        thinkingDiv.className = 'message assistant thinking';
        thinkingDiv.id = request ? `thinking-${request.id}` : 'thinking-indicator';
        if (request) request.thinkingIndicator = thinkingDiv;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();

        const textDiv = document.createElement('div');
        textDiv.className = 'message-text thinking-dots';
        textDiv.innerHTML = '<span class="dot">•</span><span class="dot">•</span><span class="dot">•</span>';

        thinkingDiv.appendChild(timeDiv);
        thinkingDiv.appendChild(textDiv);

        chatMessages.appendChild(thinkingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      // Hide the indicator and cancel any display that is still scheduled.
      function hideThinkingIndicator(request = null) {
        if (request) {
          clearTimeout(request.thinkingTimer);
          request.thinkingTimer = null;
          if (request.thinkingIndicator) request.thinkingIndicator.remove();
          request.thinkingIndicator = null;
          return;
        }
        clearTimeout(thinkingTimer);
        thinkingTimer = null;
        const thinkingIndicator = document.getElementById('thinking-indicator');
        if (thinkingIndicator) {
          thinkingIndicator.remove();
        }
      }

      function finishPendingResponse(request) {
        if (!request) return;
        hideThinkingIndicator(request);
        if (request.streamingBubble) request.streamingBubble.remove();
        if (request.captureStatus) request.captureStatus.remove();
        request.streamingBubble = null;
        request.captureStatus = null;
        pendingResponses.delete(request.id);
        retiredRequests.add(request.id);
      }

      function showResponseError(context, error, request) {
        if (!request || request.generation !== chatGeneration || pendingResponses.get(request.id) !== request) return;
        finishPendingResponse(request);
        const detail = typeof error === 'string' ? error : error && (error.error || error.message);
        addMessage(`${context}${detail ? ': ' + detail : '.'} Please try again.`, 'error');
      }

      // Minimalist Listening Animation Functions
      function showListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.add('active');

          // Start timer
          listeningStartTime = Date.now();
          listeningTimer = setInterval(() => {
            if (listeningStartTime && listeningDuration) {
              const elapsed = Math.floor((Date.now() - listeningStartTime) / 1000);
              listeningDuration.textContent = `${elapsed}s`;
            }
          }, 1000);
        }
      }

      function hideListeningAnimation() {
        if (listeningIndicator) {
          listeningIndicator.classList.remove('active');
        }

        // Hide interim overlay
        if (interimOverlay) {
          interimOverlay.classList.remove('active');
        }

        // Clear timer
        if (listeningTimer) {
          clearInterval(listeningTimer);
          listeningTimer = null;
        }

        listeningStartTime = null;
      }

      function showInterimText(text) {
        if (!interimOverlay) return;

        if (text && text.trim()) {
          interimOverlay.textContent = text;
          interimOverlay.classList.add('active');
        } else {
          interimOverlay.classList.remove('active');
        }
      }

      // Recording Event Handlers
      function handleRecordingStarted() {
        if (isRecording) return;
        isRecording = true;
        if (speechStatus) speechStatus.textContent = 'Listening…';

        if (recordingIndicator) {
          recordingIndicator.style.display = 'block';
        }
        if (micButton) {
          micButton.classList.add('recording');
        }

        showListeningAnimation();
      }

      function handleRecordingStopped() {
        if (!isRecording) return;
        isRecording = false;

        if (recordingIndicator) {
          recordingIndicator.style.display = 'none';
        }
        if (micButton) {
          micButton.classList.remove('recording');
        }

        hideListeningAnimation();
        if (speechStatus) speechStatus.textContent = 'Microphone stopped';
      }

      function handleTranscription(text) {
        if (text && typeof text === 'string' && text.trim().length > 0) {
          // VAD can deliver a transcript while capture is still listening.
          if (!isRecording) hideListeningAnimation();

          addMessage(text.trim(), 'transcription');
          scheduleThinkingIndicator();
        } else {
          console.warn('Invalid or empty transcription text - ignoring:', text);
        }
      }

      // Helpers to capture AI response into chat (text + snippets)
      function extractCodeBlocks(text) {
        if (!text) return [];
        const blocks = [];
        const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
        let match;
        while ((match = regex.exec(text)) !== null) {
          const info = (match[2] || '').trim();
          const langToken = info.split(/\s+/)[0] || 'text';
          blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
        }
        return blocks;
      }
      function stripCodeBlocks(text, blocks) {
        let result = text || '';
        blocks.forEach(b => { result = result.replace(b.fullMatch, ''); });
        return result.replace(/\n\s*\n\s*\n/g, '\n\n').trim();
      }
      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
      }
      // Copy buttons REMOVED: writing answer code to the clipboard is a
      // proctor tell (clipboard watchers see the snippets).
      function addCodeSnippet(language, code, skipPersist = false) {
        if (!chatMessages) return;
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'message-time';
        timeDiv.textContent = new Date().toLocaleTimeString();
        const textDiv = document.createElement('div');
        textDiv.className = 'message-text';

        const lang = (language || 'text').toLowerCase();
        const pre = document.createElement('pre');
        const codeEl = document.createElement('code');
        codeEl.className = `language-${lang}`;
        codeEl.innerHTML = escapeHtml(code || '');

        pre.appendChild(codeEl);
        
        const label = document.createElement('div');
        label.style.cssText = 'font-size:12px;color:rgba(255,255,255,0.8);margin-bottom:6px;';
        label.textContent = `Snippet: ${lang.toUpperCase()}`;

        textDiv.appendChild(label);
        textDiv.appendChild(pre);

        messageDiv.appendChild(timeDiv);
        messageDiv.appendChild(textDiv);
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try { if (window.Prism && Prism.highlightElement) { Prism.highlightElement(codeEl); } } catch (_) {}

        if (!skipPersist) {
          chatHistory.push({ kind: 'snippet', language: lang, code: code || '' });
          saveHistory();
        }
      }
      function renderAssistantResponse(response, requestId = null) {
        if (!response || typeof response !== 'string') return;
        // Separate requests can legitimately produce identical answers.
        // Legacy events without an ID retain content-based deduplication.
        const normalized = response.trim();
        const h = requestId ? `request:${requestId}` : `content:${hashString(normalized)}`;
        if (recentResponseHashes.has(h)) return;
        recentResponseHashes.add(h);
        if (recentResponseHashes.size > RECENT_HASH_LIMIT) {
          const first = recentResponseHashes.values().next().value;
          recentResponseHashes.delete(first);
        }

        const blocks = extractCodeBlocks(response);
        const textOnly = stripCodeBlocks(response, blocks);
        // Add text response first (if any)
        if (textOnly && textOnly.trim().length) {
          addMessage(textOnly, 'assistant');
        }
        // Add each code snippet separately
        blocks.forEach(b => addCodeSnippet(b.language, b.code));
      }

      // Basic IPC Event Listeners - simplified
      
      // Listen for transcription events
      if (whysperAPI) {
        whysperAPI.onTranscriptionReceived((event, data) => {
          if (data && data.text) {
            handleTranscription(data.text);
          } else {
            console.warn('Invalid transcription data received:', data);
          }
        });

        whysperAPI.onInterimTranscription((event, data) => {
          if (data && data.text) {
            showInterimText(data.text);
          }
        });

        // Listen for speech status
        whysperAPI.onSpeechStatus((event, data) => {
          if (data && data.status) {
            // Progress text is display-only. Explicit lifecycle events own the
            // indicator; e.g. "Recording stopped" must never restart it.
            if (speechStatus) speechStatus.textContent = data.status;
          }
        });

        // Listen for speech errors
        whysperAPI.onSpeechError((event, data) => {
          if (data && data.error) {
            addMessage(`Error in recognizing speech`, 'error');
            handleRecordingStopped();
            if (speechStatus) speechStatus.textContent = 'Speech failed. Check microphone access and retry.';
          }
        });

        // Listen for other events
        whysperAPI.onRecordingStarted(() => {
          handleRecordingStarted();
        });

        whysperAPI.onRecordingStopped(() => {
          handleRecordingStopped();
        });

        whysperAPI.onSessionCleared(() => {
          addMessage('Session memory has been cleared', 'system');
        });

        // Streaming answer lifecycle: a plain-text bubble grows as token
        // chunks arrive (transcription-llm-response-chunk), then the final
        // event replaces it with the fully formatted markdown render.
        function beginStreamingResponse(data) {
          protectMaterials(data);
          const request = beginRequest(responseId(data));
          if (!request || request.streamingBubble) return;
          // Voice starts carry messageId; retire only their pre-stream indicator.
          if (!data.requestId) hideThinkingIndicator();
          if (request.captureStatus) request.captureStatus.remove();
          request.captureStatus = null;
          const streamingBubble = document.createElement('div');
          request.streamingBubble = streamingBubble;
          request.messageId = data.messageId;
          streamingBubble.className = 'message assistant';
          const timeDiv = document.createElement('div');
          timeDiv.className = 'message-time';
          timeDiv.textContent = new Date().toLocaleTimeString();
          const textDiv = document.createElement('div');
          textDiv.className = 'message-text';
          textDiv.dataset.streamingText = '';
          streamingBubble.appendChild(timeDiv);
          streamingBubble.appendChild(textDiv);
          chatMessages.appendChild(streamingBubble);
          chatMessages.scrollTop = chatMessages.scrollHeight;
          scheduleThinkingIndicator(request);
        }

        function appendStreamingChunk(data) {
          protectMaterials(data);
          protectMaterials(data);
          const request = pendingResponse(data);
          const streamingBubble = request && request.streamingBubble;
          const delta = data.delta || '';
          if (!streamingBubble || !delta || request.messageId !== data.messageId) return;
          hideThinkingIndicator(request);
          const textDiv = streamingBubble.querySelector('.message-text');
          if (!textDiv) return;
          textDiv.dataset.streamingText = (textDiv.dataset.streamingText || '') + (delta || '');
          textDiv.textContent = textDiv.dataset.streamingText;
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Replace the temporary stream with one formatted final response.
        whysperAPI.onTranscriptionLlmResponse((event, data) => {
          protectMaterials(data);
          const request = pendingResponse(data);
          if (responseId(data) && !request) return;
          if (request) finishPendingResponse(request);
          if (data && data.response) {
            renderAssistantResponse(data.response, responseId(data));
          }
        });

        if (whysperAPI.onTranscriptionLlmResponseStart) {
          whysperAPI.onTranscriptionLlmResponseStart((event, data) => {
            if (data && data.messageId) beginStreamingResponse(data);
          });
        }
        if (whysperAPI.onTranscriptionLlmResponseChunk) {
          whysperAPI.onTranscriptionLlmResponseChunk((event, data) => {
            if (data && data.messageId) appendStreamingChunk(data);
          });
        }

        // Keystroke-capture mode UI: show a banner while capture is active
        // and focus the message input so injected characters land in it.
        // de-0002 E9: banner now carries the palette state (Q075/Q076 pin),
        // and the capture-bound 18-item palette is rendered here.
        let paletteVisible = false;
        let paletteIndex = 0;

        // The 18-item capture-bound palette (Q077(7)) — commit handlers reuse
        // existing app paths (Q071 tags: no new globals, no capture-time surface).
        const PALETTE_ITEMS = [
          { label: 'Open chat', run: () => window.electronAPI.switchToChat() },
          { label: 'Stop capture', run: () => window.api.send('toggle-capture-mode') },
          { label: 'Skill: Behavioral', run: () => window.api.send('palette-set-skill', { skill: 'behavioral' }) },
          { label: 'Skill: DSA', run: () => window.api.send('palette-set-skill', { skill: 'dsa' }) },
          { label: 'Skill: MCQ', run: () => window.api.send('palette-set-skill', { skill: 'mcq' }) },
          { label: 'Skill: OOD', run: () => window.api.send('palette-set-skill', { skill: 'ood' }) },
          { label: 'Skill: Programming', run: () => window.api.send('palette-set-skill', { skill: 'programming' }) },
          { label: 'Skill: System Design', run: () => window.api.send('palette-set-skill', { skill: 'system-design' }) },
          { label: 'Language: C++', run: () => window.api.send('save-settings', { codingLanguage: 'cpp' }) },
          { label: 'Language: C', run: () => window.api.send('save-settings', { codingLanguage: 'c' }) },
          { label: 'Language: Python', run: () => window.api.send('save-settings', { codingLanguage: 'python' }) },
          { label: 'Language: Java', run: () => window.api.send('save-settings', { codingLanguage: 'java' }) },
          { label: 'Language: JavaScript', run: () => window.api.send('save-settings', { codingLanguage: 'javascript' }) },
          { label: 'OCR screenshot', run: () => window.electronAPI.takeScreenshot() },
          { label: 'Screenshot', run: () => window.electronAPI.takeScreenshot() },
          { label: 'Toggle speech', run: () => window.api.send('toggle-recording') },
          { label: 'Shortcuts popover', run: () => window.api.send('show-shortcuts-popover') },
          { label: 'Close answer window', run: () => window.api.send('hide-llm-response') },
        ];

        function renderPalette() {
          let box = document.getElementById('capture-palette');
          if (!paletteVisible) { if (box) box.remove(); return; }
          if (!box) {
            box = document.createElement('div');
            box.id = 'capture-palette';
            box.style.cssText = 'position:fixed;top:44px;left:50%;transform:translateX(-50%);background:rgba(17,24,39,0.96);color:#e5e7eb;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:6px;z-index:9998;max-height:60vh;overflow:auto;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,0.5);';
            document.body.appendChild(box);
          }
          box.innerHTML = PALETTE_ITEMS.map((item, i) => {
            const hl = i === paletteIndex
              ? 'background:rgba(59,130,246,0.9);color:#fff;'
              : 'background:transparent;color:#e5e7eb;';
            return '<div data-palette-item="' + i + '" style="padding:6px 10px;border-radius:6px;font-size:13px;cursor:default;' + hl + '">' + item.label + '</div>';
          }).join('');
        }

        function paletteNavigate(key) {
          if (key === 'ArrowDown' || key === 'Down') { paletteIndex = (paletteIndex + 1) % PALETTE_ITEMS.length; renderPalette(); }
          else if (key === 'ArrowUp' || key === 'Up') { paletteIndex = (paletteIndex - 1 + PALETTE_ITEMS.length) % PALETTE_ITEMS.length; renderPalette(); }
          else if (key === 'Tab') { paletteIndex = (paletteIndex + 1) % PALETTE_ITEMS.length; renderPalette(); }
          else if (key === 'Enter') {
            const item = PALETTE_ITEMS[paletteIndex];
            paletteVisible = false; renderPalette();
            if (item) { try { item.run(); } catch (e) { console.warn('palette action failed', e); } }
          } else if (key && key.length === 1) {
            const lower = key.toLowerCase();
            const idx = PALETTE_ITEMS.findIndex((it, i) => i > paletteIndex && it.label.toLowerCase().startsWith(lower));
            const wrap = PALETTE_ITEMS.findIndex((it) => it.label.toLowerCase().startsWith(lower));
            const next = idx >= 0 ? idx : wrap;
            if (next >= 0) { paletteIndex = next; renderPalette(); }
          }
        }

        if (whysperAPI.onPaletteKey) {
          whysperAPI.onPaletteKey((event, data) => {
            if (data && data.key) paletteNavigate(data.key);
          });
        }

        if (whysperAPI.onCaptureModeChanged) {
          whysperAPI.onCaptureModeChanged((event, data) => {
            const active = data && data.active;
            paletteVisible = !!(active && data && data.paletteOpen);
            if (paletteVisible) { paletteIndex = 0; renderPalette(); } else { renderPalette(); }
            let banner = document.getElementById('capture-mode-banner');
            if (active) {
              if (!banner) {
                banner = document.createElement('div');
                banner.id = 'capture-mode-banner';
                banner.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(59,130,246,0.95);color:#fff;padding:6px 14px;border-radius:8px;font-size:12px;z-index:9999;pointer-events:none;';
                document.body.appendChild(banner);
              }
              banner.textContent = paletteVisible
                ? 'CAPTURING — menu open · ↑↓ choose · Enter commits · Esc exits'
                : 'CAPTURING — Enter sends, Esc exits';
              if (messageInput) messageInput.focus();
            } else if (banner) {
              banner.remove();
            }
          });
        }
        if (whysperAPI.onCaptureModeError) {
          whysperAPI.onCaptureModeError((event, data) => {
            addMessage(data && data.message ? data.message : 'Keystroke capture failed', 'error');
          });
        }

        // Tell the main process which window the user last clicked into, so
        // keystroke-capture mode routes keystrokes to the right window.
        document.addEventListener('focusin', (e) => {
          const target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
            if (window.api && window.api.send) window.api.send('input-target-focused');
          }
        });
      }

      // UI Event Listeners
      if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', () => clearChatHistory());
      }

      if (micButton) {
        micButton.addEventListener('click', async () => {
          if (!isInteractive) {
            addMessage('Window is in non-interactive mode. Press Alt+A to enable interaction.', 'error');
            return;
          }
          if (!speechAvailable) {
            addMessage('Speech recognition is not configured.', 'system');
            return;
          }

          try {
            if (whysperAPI) {
              await whysperAPI.toggleSpeechRecognition();
            }
          } catch (error) {
            addMessage("Error in recognizing speech", 'error');
          }
        });
      }

      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        const request = beginRequest();
        addMessage(text, 'user');
        messageInput.value = '';
        autoGrow(messageInput);
        scheduleThinkingIndicator(request);
        try {
          if (!whysperAPI || !whysperAPI.sendChatMessage) {
            throw new Error('Chat is unavailable');
          }
          await whysperAPI.sendChatMessage(text, request.id);
        } catch (error) {
          showResponseError('Could not send your message', error, request);
        }
      }

      if (sendButton) {
        sendButton.addEventListener('click', sendMessage);
      }

      // Auto-resize for multiline textarea
      function autoGrow(el) {
        if (!el) return;
        el.style.height = 'auto';
        const max = 140; // keep within container limits
        el.style.height = Math.min(el.scrollHeight, max) + 'px';
      }
      if (messageInput) {
        autoGrow(messageInput);
        messageInput.addEventListener('input', () => autoGrow(messageInput));
      }

      // Replace keypress with keydown to support Shift+Enter for newline and Enter to send
      if (messageInput) {
        messageInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            await sendMessage();
          }
          // If Shift+Enter, allow default to insert newline
        });
      }

      // Global shortcuts are owned by the main process. A second local
      // Alt+R handler can toggle the same recording twice in a focused window.

      // Initialize
      // NOTE: the previous default message claimed "Recording in Progress"
      // even when no speech provider existed — a UI lie at fresh launch.
      // Chat now starts clean; the capture-mode banner appears only while
      // keystroke capture is actually active.
    </script>
  <script src="src/ui/materials-links.js"></script>
</body>
</html>
