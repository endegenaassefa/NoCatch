name: Build & Release

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed:
        description: Build with signing and notarization credentials
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Packaging contract tests
        run: npm run test:packaging
      - name: Existing input-routing regression tests
        run: node scripts/test-capture-routing.js
      - name: Setup, account, platform and voice regression tests
        run: node --test scripts/test-setup-service.js scripts/test-onboarding.js scripts/test-managed-client.js scripts/test-managed-server.js scripts/test-platform.js scripts/test-portable-voice.cjs scripts/test-whisper-worker.cjs scripts/test-main-session-isolation.cjs
      - name: Set release version
        run: node scripts/set-version-from-tag.js
      - name: Prepare public managed deployment configuration
        env:
          OPENCLUELY_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && '1' || '0' }}
          OPENCLUELY_MANAGED_CONFIG_JSON: ${{ vars.OPENCLUELY_MANAGED_CONFIG_JSON }}
        run: node scripts/prepare-managed-config.js
      - name: Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Build artifacts (never publish from builder)
        env:
          OPENCLUELY_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && '1' || '0' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && 'true' || 'false' }}
          CSC_LINK: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.signed == true) && matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run build:${{ matrix.platform }}
      - name: Windows packaged first-run smoke test
        if: matrix.platform == 'win'
        run: node scripts/test-packaged-startup.js dist/win-unpacked/screen-reader-util.exe
      - name: Verify artifact coverage and update metadata
        run: node scripts/release-artifacts.js verify dist ${{ matrix.platform }}
      - name: Upload installers and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: opencluely-${{ matrix.platform }}
          path: |
            dist/OpenCluely-*
            dist/*.yml
            !dist/builder-*.yml
          if-no-files-found: error

  release:
    name: Prepare signed release draft
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install artifact-validator dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Set release version
        run: node scripts/set-version-from-tag.js
      - uses: actions/download-artifact@v4
        with:
          pattern: opencluely-*
          path: artifacts
      - name: Collect complete artifacts and checksums
        run: node scripts/release-artifacts.js collect artifacts release
      # Full feature parity is a separate release gate. A successful build must
      # not publish an unqualified product to users automatically.
      - name: Create draft for qualification
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            These builds are awaiting full Windows/macOS feature qualification.
            Build success does not establish native-feature parity or a working
            managed sign-in service. See docs/CROSS-PLATFORM-DESIGN.md.

            Assets include Windows installers/portable builds, Mac DMG/ZIP
            builds, Linux packages, update metadata and SHA256SUMS.txt.
          files: release/*
          fail_on_unmatched_files: true
